# Loader overlay for the real-host smoke (`dsh web --patch`): isolate the MCP
# tool listener and pin the in-browser directory picker. An OS-assigned tool
# port keeps the smoke independent from an installed desktop runtime. The
# shipped picker row is `-auto`, which resolves to
# the native OS chooser on a loopback bind with a local display — an
# interaction a Playwright page cannot drive, so the resolved backend would
# otherwise decide whether the smoke passes. The disable+insert pair mirrors
# apps/web/tests/scaffold.ts.
- id: mcp-tool-runtime
  config:
    host: 127.0.0.1
    port: 0
    path: /mcp/tool-runtime
- id: directory-picker
  disabled: true
- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
