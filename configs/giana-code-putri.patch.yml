# Native GLM discovery changes request presentation only, never tool permissions.
- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE
    onDemand:
      providers:
        - glm-local-r5300
        - qwen-local-r5300
        - glm-uncensored-local-r5300
        - deepseek-vision-local-r5300
        - deepseek-vision-uncensored-local-r5300
      alwaysAvailable:
        - read
        - skill
        - skill_search
      maxSearchResults: 4
      maxActiveTools: 16

- insert:
    - id: model-lifecycle
      name: '@deepseek-ai/dsh-model-lifecycle'
      config:
        preference: automatic
        idleUnloadMs: 0
        preserveResidentOnShutdown: true

    - id: giana-cowork-model-deployment
      name: '@deepseek-ai/dsh-giana-cowork-model-deployment'
      config:
        admissionReceiptPath: !!js process.env.DSH_SOURCE_ROOT + '/configs/giana-cowork-preview/GCP_DUAL_TARGET_LOCAL_MODEL_PREVIEW_ADMISSION_20260915.json'
        registryPath: !!js process.env.DSH_SOURCE_ROOT + '/configs/giana-cowork-preview/gcp.model-registry.json'
        statePath: !!js process.env.DSH_HOME + '/state/giana-cowork-preview/model-manager-state-v2.json'
        auditPath: !!js process.env.DSH_HOME + '/state/giana-cowork-preview/model-lifecycle-audit.jsonl'
        managerScript: !!js process.env.DSH_HOME + '/profiles/web/node_modules/@deepseek-ai/dsh-giana-cowork-model-deployment/lib/manager.js'
        runners:
          - target: r5300
            kind: ssh
            executable: 'C:\Windows\System32\OpenSSH\ssh.exe'
            configPath: 'C:\Users\grinv\.ssh\config'
            host: r5300
          - target: prdg
            kind: wsl
            executable: 'C:\Windows\System32\wsl.exe'
            distribution: Ubuntu-22.04
        workId: giana-cowork-preview-local-model-heqa-20260911
        principalId: alex
        tenantId: giana-cowork-preview
        issuerRef: giana:issuer:sha256:8fcaed49cd538cb6494053c7f2958fe9f48091e19f4258105fb5aa2a571e392a
        holderRef: giana:holder:sha256:23a5fc97f64fa90efc8fd2a913cab32474ba267195d6c6be89beb70ba809c5ee
        admissionDigest: bba72fc758c7e4729c284522c910b90feceb5148ceb07cfbaeec3dcd4232b537
        leaseTtlMs: 1800000
        operationTimeoutMs: 1500000
        maxClockSkewMs: 10000
        targets:
          - class: r5300
            identityDigest: 91eda62878736036ed54fa46478df41b8bb3dd8fb6b4103a21cc7357eaa56ffa
            currentnessDigest: 9dec2105ddfccfe64aa21b337a9f0669eba2d01e359d75318074afa7bcbceb37
          - class: prdg
            identityDigest: bf7a58918d355c553f4852af75b3875e208d140a5060fe62cb4215cfceae64c5
            currentnessDigest: 8f1ce22cfbf3de77e8c559180638ddcb1ad28b69981cc6a45309d2c8d9b2c942
        localProviderIds:
          - glm-local-r5300
          - qwen-local-r5300
          - glm-uncensored-local-r5300
          - deepseek-vision-local-r5300
          - deepseek-vision-uncensored-local-r5300
        routes:
          - id: glm53-official-fp8
            provider: glm-local-r5300
            model: GLM-5.3-Flash-official-fp8-canary
            disposition: AVAILABLE
            admissionReceiptDigest: sha256:bba72fc758c7e4729c284522c910b90feceb5148ceb07cfbaeec3dcd4232b537
            revisionDigest: sha256:af139ab51af2a3ad155f9b012e1351ec074b7b3672262db7a9ebb6c845742aa4
            targets:
              - r5300
            allowRamCpuOffload: true
            allowExactResidentAdoption: true
            supportedReasoningEfforts:
              - high
            stageTimeoutsMs:
              start: 1200000
              health: 180000
              probe: 180000
          - id: qwen38-local
            provider: qwen-local-r5300
            model: Qwen/Qwen3.8-27B
            disposition: AVAILABLE
            admissionReceiptDigest: sha256:bba72fc758c7e4729c284522c910b90feceb5148ceb07cfbaeec3dcd4232b537
            revisionDigest: sha256:5da5832e0b3c0351bfb24486451b28649e629a6d14ef17c215358d8721b8b7d2
            targets:
              - r5300
              - prdg
            allowRamCpuOffload: false
            allowExactResidentAdoption: true
            supportedReasoningEfforts:
              - low
              - medium
              - xhigh
            stageTimeoutsMs:
              start: 1200000
              health: 180000
              probe: 180000

    - id: llm-gianaos-acp
      name: '@grinviro/dsh-llm-gianaos-acp'
      config:
        providerId: gianaos
        providerName: GianaOS
        modelId: putri
        modelName: Putri
        description: Canonical Putri with native Giana CoWork tools through GianaOS ACP
        principalId: giana.putri
        routeRevision: giana-code-acp-native-v1
        launchCommand: 'C:\Program Files\nodejs\node.exe'
        launchArguments: []
        launchScript: !!js process.env.DSH_SOURCE_ROOT + '/scripts/princess-os/Start-GianaOsPutriAcp.mjs'
        localWorkspace: !!js process.env.DSH_SOURCE_ROOT
        remoteWorkspace: /srv/gianaos-data/objects/putri
        remoteToolRuntimeUrl: http://127.0.0.1:18644/mcp/tool-runtime
        permission: allow
        turnIdleTimeoutMs: 660000
        contextWindow: 1000000
        maxTokens: 131072

    - id: llm-princess-os
      name: '@grinviro/dsh-llm-princess-os'
      config:
        providerId: princess-os
        providerName: Princess OS
        agentDescription: Princess OS private agent via ACP
        systemInstruction: Giana CoWork is only the workbench projection. Princess OS owns this private agent identity, session, memory, tools, and approvals. Do not claim to be one of the Giana Girls and do not write to any GianaOS profile or canonical database.
        pythonCommand: 'N:\PrincessOS\runtime\Scripts\python.exe'
        hermesSource: 'N:\GianaOS\gianaos-agent'
        workspace: !!js process.env.DSH_SOURCE_ROOT
        credentialEnv: DEEPSEEK_API_KEY
        permission: allow
        agents:
          - id: lara
            name: Lara
            hermesHome: 'N:\PrincessOS\agents\lara\home'
            ownerPrivateWindowsBindingSha256: ''

# The desktop app serves prebuilt client bundles. The upstream HMR row polls
# every client bundle on the N: worktree every 500 ms and is only useful while
# pnpm's watch build is running, so keep it out of the stable desktop runtime.
- id: web-runtime
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: true
    surfaceContext: true
    trustedHosts: !!js ctx.webStartup.trustedHosts
    desktopShutdown: !!js "process.env.GIANA_COWORK_DESKTOP_SHUTDOWN_TOKEN !== undefined"

- id: approval
  config:
    # Full filesystem access must not silently disable the one-shot consent
    # boundary used by Windows computer-use and other explicitly guarded tools.
    policy: ask

- id: permission
  config:
    reconcileExistingPresets:
      - danger-full-access
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: ask

- id: client-hmr
  disabled: true

- id: dsh-office
  name: '@huiliyi37/dsh-office'
  config:
      enable:
        xlsx: true
        pdf: true
        ppt: true
        docx: true

- insert:
    - id: mcp-markitdown
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: markitdown
        transport: stdio
        command: 'N:\PrincessOS\workbench\third-party\markitdown-mcp-venv-20260822\Scripts\markitdown-mcp.exe'
        cwd: 'N:\PrincessOS\workbench\third-party\markitdown-mcp-venv-20260822'
    - id: mcp-playwright
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: playwright
        transport: stdio
        command: 'C:\Program Files\nodejs\node.exe'
        cwd: 'N:\PrincessOS\workbench\ui-test-workspace'
        args:
          - !!js process.env.DSH_HOME + '/profiles/web/node_modules/@playwright/mcp/cli.js'
          - --isolated
          - --headless
          - --sandbox
          - --browser
          - chrome
          - --caps
          - vision,testing,devtools
          - --image-responses
          - allow
          - --output-dir
          - !!js process.env.DSH_SOURCE_ROOT + '/.artifacts/playwright-mcp/output'
          - --output-max-size
          - '104857600'
          - --block-service-workers
          - --codegen
          - typescript
          - --snapshot-mode
          - full
          - --timeout-action
          - '10000'
          - --timeout-navigation
          - '60000'
        toolCallTimeoutMs: 120000
        failOnStartupError: true
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 5000
          maxAttempts: 3
    - id: mcp-connectors
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: connectors
        transport: streamable-http
        url: http://127.0.0.1:17301/mcp
        headersFromEnv:
          Authorization: OOMOL_CONNECT_RUNTIME_AUTHORIZATION
        toolCallTimeoutMs: 120000
        # Connector startup is supervised by the desktop launcher. A brief
        # gateway restart must degrade this capability, not terminate DSH.
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 5000
          maxAttempts: 30
    - id: mcp-windows-desktop
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: windows_desktop
        transport: stdio
        command: 'N:\PrincessOS\workbench\third-party\windows-computer-use-mcp-20260822\.venv\Scripts\windows-computer-use-mcp.exe'
        cwd: 'N:\PrincessOS\workbench\third-party\windows-computer-use-mcp-20260822'
        env:
          # Safe-by-default staging: desktop actions require explicit HITL
          # approval and remain simulated until HEQA passes and a separately
          # reviewed route proves a reversible window handle.
          WINDOWS_COMPUTER_USE_MCP_BYPASS_HITL: '0'
          WINDOWS_COMPUTER_USE_MCP_KILL_SWITCH: '0'
          WINDOWS_COMPUTER_USE_MCP_DRY_RUN: '1'
          WINDOWS_COMPUTER_USE_MCP_ENABLE_FACE: '0'
          WINDOWS_COMPUTER_USE_MCP_ENABLE_KEYLOGGER: '0'
          WINDOWS_COMPUTER_USE_MCP_MAX_ACTIONS_PER_MINUTE: '240'
        toolCallTimeoutMs: 120000
        failOnStartupError: true
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 5000
          maxAttempts: 3

- insert:
    - id: tool-access-policy
      name: '@grinviro/dsh-tool-access-policy'
      config:
        # The vendor's approve_automation tool only flips process-local state,
        # so the complete Windows namespace must cross DSH's external,
        # one-shot approval boundary before any tool body can run.
        denyPatterns:
          - mcp__windows_desktop__automation_face
          - mcp__windows_desktop__global_keylogger
        askPatterns:
          - mcp__windows_desktop__*
    - id: subagent-codex
      name: '@deepseek-ai/dsh-subagent-codex'
      config:
        providerName: codex
        permissionMode: never
    - id: subagent-claude-code
      name: '@deepseek-ai/dsh-subagent-claude-code'
      config:
        providerName: claude-code
        permissionMode: dontAsk

# The preserved desktop runtime owns 18643. The isolated Putri candidate gets
# its own loopback listener so its MCP tool bridge cannot collide with it.
- id: mcp-tool-runtime
  name: '@deepseek-ai/dsh-mcp-server-tool-runtime'
  config:
    host: 127.0.0.1
    port: 18644
    path: /mcp/tool-runtime
